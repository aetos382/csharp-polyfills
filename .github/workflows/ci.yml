name: CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to pack (e.g. 1.2.3).'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-slim

    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected a format like 1.2.3 or 1.2.3-preview.1"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          dotnet pack Sources/Aetos.CSharpPolyfills/Aetos.CSharpPolyfills.csproj
          --configuration Release
          --output artifacts
          --version "$VERSION"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifacts/*.nupkg
          archive: false
          if-no-files-found: error

      - name: Push to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/aetos382/index.json
          --api-key "$NUGET_API_KEY"
